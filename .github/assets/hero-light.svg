<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-label="Headroom. A 55,957 token agent prompt is compressed to 24,340 tokens sent to the model, saving 31,617 tokens or 57 percent. The FATAL log line buried inside survives compression.">
  <defs>
    <!-- Brand purple is the docs site's own accent, hsl(262 60% 65%) = #9B7BEA.
         Green marks what survives, purple what is spent, coral the one line
         that must never be dropped. -->
    <!-- purple #9B7BEA · violet #C4A9FF · green #4ADE80 · coral #FF7A8A · ink #0B0B10 · mist #6B7280 -->

    <linearGradient id="hd-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="55%"  stop-color="#6D3FD6"/>
      <stop offset="100%" stop-color="#0E9F6E"/>
    </linearGradient>

    <linearGradient id="hd-before" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="820" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>

    <linearGradient id="hd-after" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="395" y2="0">
      <stop offset="0%"   stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <radialGradient id="hd-halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%"   stop-color="#9B7BEA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9B7BEA" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hd-shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="150" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="hd-clip-after"><rect x="60" y="196" width="335" height="34" rx="8"/></clipPath>

    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

      /* The removed span breathes, so the eye lands on the gap between bars. */
      .saved { animation: sv 3.4s ease-in-out infinite; }
      @keyframes sv { 0%,100% { opacity: .30 } 50% { opacity: .13 } }

      /* A highlight sweeps the compressed bar: motion without noise. */
      .sweep { animation: sw 3.4s ease-in-out infinite; }
      @keyframes sw { 0% { transform: translateX(-150px) } 60%,100% { transform: translateX(400px) } }

      /* The FATAL marker pulses in both bars, in step, to read as "same line". */
      .keep  { animation: kp 3.4s ease-in-out infinite; }
      @keyframes kp { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

      @media (prefers-reduced-motion: reduce) {
        .saved, .sweep, .keep { animation: none }
      }
    </style>
  </defs>

  <rect width="880" height="320" fill="#FFFFFF"/>
  <rect width="880" height="200" fill="url(#hd-halo)"/>

  <!-- ── wordmark ───────────────────────────────────────────────────────── -->
  <text x="440" y="72" class="s" font-size="46" font-weight="800" letter-spacing="-1.4"
        fill="url(#hd-word)" text-anchor="middle">headroom</text>
  <text x="440" y="102" class="s" font-size="15" fill="#6B7280" text-anchor="middle">
    Your agent&#8217;s context, minus what it never needed.
  </text>

  <!-- ── before ─────────────────────────────────────────────────────────── -->
  <text x="60"  y="150" class="s" font-size="11" fill="#6B7280" letter-spacing="1.4">AGENT PROMPT</text>
  <text x="820" y="150" class="m" font-size="13" fill="#111827" text-anchor="end" font-weight="600">55,957 tokens</text>
  <rect x="60" y="158" width="760" height="34" rx="8" fill="url(#hd-before)"/>
  <rect class="saved" x="395" y="158" width="425" height="34" rx="8" fill="#FFFFFF" opacity=".60"/>
  <rect class="keep" x="292" y="158" width="5" height="34" fill="#DC2626"/>

  <!-- ── after ──────────────────────────────────────────────────────────── -->
  <rect x="60" y="196" width="335" height="34" rx="8" fill="url(#hd-after)"/>
  <g clip-path="url(#hd-clip-after)">
    <rect class="sweep" x="60" y="196" width="150" height="34" fill="url(#hd-shimmer)"/>
  </g>
  <rect class="keep" x="292" y="196" width="5" height="34" fill="#DC2626"/>

  <text x="60"  y="252" class="s" font-size="11" fill="#6B7280" letter-spacing="1.4">SENT TO MODEL</text>
  <text x="395" y="252" class="m" font-size="13" fill="#15803D" text-anchor="end" font-weight="600">24,340 tokens</text>

  <!-- saved callout, sitting over the removed span -->
  <text x="607" y="180" class="s" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">31,617 saved</text>
  <text x="607" y="216" class="s" font-size="12" fill="#6B7280" text-anchor="middle">57% fewer input tokens</text>

  <!-- ── footer ─────────────────────────────────────────────────────────── -->
  <rect x="292" y="278" width="5" height="12" fill="#DC2626"/>
  <text x="308" y="288" class="m" font-size="11" fill="#6B7280">the <tspan fill="#DC2626">FATAL</tspan> line buried at item 67 survives, byte for byte</text>
</svg>
